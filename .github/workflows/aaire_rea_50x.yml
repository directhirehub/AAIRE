name: AAIRE-REA 50X Autonomous Hyper-Pipeline

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  rea-50x-sync-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AAIRE Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run REA 50X Core Hub (Decompile + Learn + Vault + Backup)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python3 aaire_core/rea_runtime/hub_orchestrator.py

      - name: CI Audit Gate (Test Polyglot Code Decompiler & Fact Search)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python3 aaire_core/rea_runtime/hub_orchestrator.py "remote python developer"
          python3 aaire_core/rea_runtime/hub_orchestrator.py "pragma solidity ^0.8.0; contract Vault {}"

      - name: Commit Updated Storage, Memory & Backups
        run: |
          git config user.name "AAIRE-REA-50X Bot"
          git config user.email "bot@directhirehub.in"
          git add aaire_storage/verified_oracle_feed.json aaire_storage/learned_patterns.json aaire_storage/aaire_memory/episodic_memory.json aaire_storage/aaire_backup/
          git diff --staged --quiet || git commit -m "⚡ [AAIRE-REA 50X] Sync Vault, Memory & Backups [skip ci]"
          git push origin main
          
