name: AAIRE v4.1 Autonomous Brain & Memory Sync

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: aaire-autonomous-sync
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  run-aaire-brain:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout AAIRE Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Run Layer 3 Unit, Network, Singularity & Oracle Tests
        run: |
          export PYTHONPATH=$PYTHONPATH:.
          python3 aaire_tests/test_local_agent.py
          python3 aaire_tests/test_network_integration.py
          python3 aaire_tests/test_hyper_singularity.py
          python3 aaire_tests/test_zero_rot_oracle.py

      - name: 4. Execute AAIRE Master Brain, Orchestrator & Commercial Oracle
        run: |
          export PYTHONPATH=$PYTHONPATH:.
          python3 aaire_core/local_agent.py
          python3 aaire_core/master_orchestrator.py
          python3 aaire_core/oracle_pipeline.py

      - name: 5. Verify Cryptographic Merkle State Ledger
        run: |
          export PYTHONPATH=$PYTHONPATH:.
          python3 -c "from aaire_storage.merkle_blockchain import MerkleBlockchainVault; assert MerkleBlockchainVault().verify_chain(), 'Chain Invalid!'; print('Merkle Blockchain Verified!')"

      - name: 6. Auto-Save Memory, Oracle Feed & Backups to aaire_storage
        run: |
          find aaire_storage -name "__pycache__" -type d -exec rm -rf {} +
          cp -r aaire_storage /tmp/aaire_storage_sync
          git fetch origin main
          git reset --hard origin/main
          rm -rf aaire_storage
          mv /tmp/aaire_storage_sync aaire_storage
          git config --local user.email "aaire-bot@users.noreply.github.com"
          git config --local user.name "AAIRE Autonomous Bot"
          git add aaire_storage/
          git diff --staged --quiet || (git commit -m "Auto-Sync: AAIRE Zero-Rot Oracle Feed & Compact Vault" && git push origin HEAD:main)
          
