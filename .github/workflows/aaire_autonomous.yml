name: AAIRE Autonomous Swarm Pipeline

on:
  schedule:
    - cron: '0 */6 * * *'  # हर 6 घंटे में ऑटोनॉमस रन
  workflow_dispatch:
    inputs:
      swarm_objective:
        description: 'Task or Objective for AAIRE Swarm'
        required: false
        default: 'autonomous_maintenance_and_sync'

env:
  PYTHONUNBUFFERED: "1"
  SWARM_ENABLED: "true"
  SWARM_SCALING_MODE: "dynamic_unlimited"
  SWARM_ALLOW_DYNAMIC_AGENT_CREATION: "true"
  DECOMPOSER_MAX_SUBTASKS: "UNLIMITED"
  QUALITY_GATE_STRICT: "true"
  QUALITY_MIN_SCORE: "0.85"

jobs:
  aaire-autonomous-swarm:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout AAIRE Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Inject AAIRE v15.2 Ecosystem Runtime Config
        run: |
          cat << 'EOF' > /tmp/aaire_swarm_runtime.json
          {
            "swarm_version": "15.2-ecosystem-with-autodocs",
            "orchestration": {
              "mode": "elastic_async_dag",
              "max_agents": "unlimited",
              "dynamic_agent_forge": true,
              "auto_spawn_custom_roles": true,
              "total_legacy_modules": 12,
              "total_advanced_modules": 23,
              "total_active_ecosystem_modules": 35
            },
            "quality_gate": {
              "enabled": true,
              "enforce_ast_guard": true,
              "min_confidence": 0.85
            }
          }
          EOF
          echo "SWARM_CONFIG_PATH=/tmp/aaire_swarm_runtime.json" >> $GITHUB_ENV

      - name: Execute AAIRE Master Orchestrator (v15.2 Kernel & Auto-Docs)
        run: |
          python aaire_core/master_orchestrator.py auto "${{ github.event.inputs.swarm_objective || 'autonomous_maintenance_and_sync' }}"
          pytest aaire_tests/ || true

      - name: Commit & Sync Autonomous State Snapshots & Documentation
        run: |
          git config --local user.email "aaire-bot@users.noreply.github.com"
          git config --local user.name "AAIRE Autonomous Core"
          git add aaire_storage/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(swarm): sync v15.2 35-module ecosystem kernel, state snapshots & system docs" && git push)
          
