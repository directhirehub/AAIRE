name: AAIRE v4.1 Autonomous Brain & Memory Sync

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      custom_goal:
        description: 'AAIRE Master Brain ke liye Goal likhein'
        required: false
        default: 'Execute autonomous self-optimization and heuristic pattern learning'

permissions:
  contents: write

jobs:
  run-aaire-brain:
    runs-only: ubuntu-latest
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout AAIRE Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Run Layer-3 Unit Tests (Sandbox Verification)
        run: python3 aaire_tests/test_local_agent.py

      - name: 4. Execute AAIRE v4.1 Master Brain (Live Memory Generation)
        run: |
          GOAL="${{ github.event.inputs.custom_goal || 'Execute autonomous self-optimization and heuristic pattern learning' }}"
          python3 aaire_core/local_agent.py --goal "$GOAL"

      - name: 5. Verify Cryptographic Merkle State Ledger
        run: python3 aaire_core/local_agent.py --verify-ledger

      - name: 6. Auto-Save Memory & Backups to aaire_storage
        run: |
          git config user.name "AAIRE-Autonomous-Bot"
          git config user.email "aaire-bot@users.noreply.github.com"
          git add aaire_storage/
          if git diff --staged --quiet; then
            echo "No new memory changes to commit."
          else
            git commit -m "Auto-Sync: AAIRE v4.1 Memory, Merkle Ledger & Learned Patterns"
            git push
          fi
          
